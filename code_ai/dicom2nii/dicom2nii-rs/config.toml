]

# T2 series
t2_series = [
    "T2", "T2_AXI", "T2_COR", "T2_SAG",
    "T2CE", "T2CE_AXI", "T2CE_COR", "T2CE_SAG",
    "T2FLAIR", "T2FLAIR_AXI", "T2FLAIR_COR", "T2FLAIR_SAG",
    "T2FLAIRCE", "T2FLAIRCE_AXI", "T2FLAIRCE_COR", "T2FLAIRCE_SAG",
