    "T1FLAIRCUBECE", "T1FLAIRCUBECE_AXI", "T1FLAIRCUBECE_COR", "T1FLAIRCUBECE_SAG",
    "T1BRAVO", "T1BRAVO_AXI", "T1BRAVOCE_AXI", "T1BRAVO_SAG", "T1BRAVOCE_SAG",
    "T1BRAVO_COR", "T1BRAVOCE_COR",
    "T1CUBE_AXIr", "T1CUBE_CORr", "T1CUBE_SAGr",
    "T1CUBECE_AXIr", "T1CUBECE_CORr", "T1CUBECE_SAGr",
    "T1FLAIRCUBE_AXIr", "T1FLAIRCUBE_CORr", "T1FLAIRCUBE_SAGr",
