[project]
name = "shh_ai_pyton"
version = "0.2.0"  # 版本升級，標記重大架構變更
description = "醫學影像處理系統 - 基於 PgQueuer 的佇列架構"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web core dependencies
    "aiofiles>=24.1.0",
    "db-libs>=1.1",
    "fastapi>=0.115.12",
    "httpx==0.28.1",
    "orjson==3.10.15",
    "pandas==2.1.3",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.38",
    "tqdm==4.67.1",
    
    # 醫學影像處理核心依賴
    "nibabel==5.3.2",
    "pydicom==2.4.3",
    "pydicom-seg==0.4.1",
    "pyorthanc[all]>=1.20.0",
    "simpleitk==2.4.1",
    "matplotlib==3.8.2",
    "numpy==1.26.0",
    "numba==0.61.0",
    
    # 系統依賴
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "python-multipart>=0.0.20",
    "psutil>=7.0.0",
    
    # PostgreSQL 和佇列依賴
    "asyncpg>=0.30.0",
    "pgqueuer>=0.24.1",
    
    # 快取和進階功能
    "fastapi-cache2>=0.2.2",
    "reflex>=0.7.14",
    "advanced-alchemy==1.4.4",
    "scikit-image>=0.25.2",
    "pynvml>=11.5.3",
    "openpyxl>=3.1.5",
    
    # 移除的依賴 (已註解以供參考)
    # "funboost==48.4",     # 已移除：使用 pgqueuer 替代
    # "redis==5.2.1",       # 已移除：不再需要 Redis
    # "celery==5.4.0",      # 已移除：不再需要 Celery
]

[dependency-groups]
ai = [
    # AI and GPU related packages
    "brainextractor>=0.2.2",
    "scikit-image==0.25.2",
    "scikit-learn>=1.6.1",
    "opencv-python-headless==4.9.0.80"
]

dev = [
    # 開發工具
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]

all = [
    { include-group = "ai" },
    { include-group = "dev" },
]

# PgQueuer 相關配置
[tool.pgqueuer]
connection_string = "postgresql://postgres_n:postgres_p@127.0.0.1:15433/dicom"
max_concurrent_jobs = 10
default_qps = 1
job_timeout = 3600

# 工具配置
[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "W", "F", "I", "N", "B", "C4", "UP"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=code_ai --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
