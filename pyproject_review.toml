[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shh_ai_python"
version = "2.0.0"
description = "Medical imaging AI processing system with clean architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SHH AI Team", email = "ai@shh.com"},
]

# Core dependencies only - no dev dependencies here
dependencies = [
    # FastAPI and async web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # Database and caching
    "sqlalchemy>=2.0.38",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "advanced-alchemy>=1.4.4",
    
    # Medical imaging
    "nibabel>=5.3.0",
    "pydicom>=2.4.3",
    "pydicom-seg>=0.4.1",
    "simpleitk>=2.4.0",
    "scikit-image>=0.25.0",
    
    # Data processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "numba>=0.61.0",
    "openpyxl>=3.1.5",
    
    # Task queue
    "funboost>=48.4",
    "pgqueuer>=0.24.1",
    
    # Utilities
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "tqdm>=4.67.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "psutil>=7.0.0",
    "pynvml>=11.5.3",
    
    # Caching
    "fastapi-cache2>=0.2.2",
]

[project.optional-dependencies]
ai = [
    "brainextractor>=0.2.2",
    "scikit-learn>=1.6.0",
    "opencv-python-headless>=4.9.0.80",
]

[tool.uv]
# UV-specific development dependencies
dev-dependencies = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",  # For testing FastAPI
    
    # Code quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "bandit>=1.8.0",  # Security linting
    
    # Type stubs
    "types-redis>=4.6.0",
    "types-pyyaml>=6.0.0",
    "types-aiofiles>=24.1.0",
    "types-tqdm>=4.66.0",
    
    # Documentation
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    
    # Development tools
    "pre-commit>=4.0.0",
    "ipython>=8.30.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # `zip()` without an explicit `strict=` parameter
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "funboost.*",
    "nibabel.*",
    "pydicom.*",
    "SimpleITK.*",
    "numba.*",
    "cv2.*",
    "skimage.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    --strict-markers
    --tb=short
    --cov=code_ai
    --cov=backend
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-fail-under=80
    -p no:warnings
"""
asyncio_mode = "auto"
timeout = 300

[tool.coverage.run]
source = ["code_ai", "backend"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "test"]
skips = ["B101", "B601"]  # Skip assert_used and shell_task tests
